name: Demo

# Die öffentliche Demo auf GitHub Pages — wie im Energietracker: die App-Hülle
# ohne PHP, die Antworten vorberechnet vom echten Server (tools/build-demo.sh,
# Beispielpaar Kim & Alex, Archiv der letzten 60 Tage). Gebaut wird aus dem
# neuesten Release-Tag — die Demo zeigt, was veröffentlicht ist. Kennt der Tag
# tools/build-demo.sh noch nicht (Releases vor 2.2.0), baut der Lauf aus main.
#   • beim Veröffentlichen eines GitHub-Releases
#   • täglich, damit in der Demo jeden Tag ein frisches Flunkoskop steht
#   • von Hand
on:
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Gebaut wird nur mit Leserechten; schreiben darf allein der Job, der
# veröffentlicht, und der führt nur Actions von GitHub selbst aus.
permissions:
  contents: read

# Eine Veröffentlichung zur Zeit; eine neuere ersetzt eine wartende.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Demo bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Neuestes Release auschecken
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          fi
          if [ -n "$TAG" ] && git cat-file -e "$TAG:tools/build-demo.sh" 2>/dev/null; then
            git checkout --quiet "$TAG"
            echo "Demo aus $TAG"
          else
            echo "Demo aus main (${TAG:-kein Tag} enthält tools/build-demo.sh noch nicht)"
          fi

      - name: PHP einrichten (8.4)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: mbstring, json
          coverage: none

      - name: Demo bauen
        run: bash tools/build-demo.sh dist/demo

      - name: Hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo

  deploy:
    name: Demo veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages einrichten
        uses: actions/configure-pages@v6

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
