<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0820"/>
      <stop offset="62%" stop-color="#171034"/>
      <stop offset="100%" stop-color="#120d2c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B5BD6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7B5BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#5fc6da"/>
      <stop offset="100%" stop-color="#5fc6da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ef7d9c"/>
      <stop offset="100%" stop-color="#ef7d9c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <ellipse cx="1000" cy="40" rx="420" ry="260" fill="url(#glow1)"/>

  <!-- Sternenhimmel -->
  <g fill="#cfd4ef">
    <circle cx="64" cy="52" r="1.6"/><circle cx="188" cy="118" r="1.1"/><circle cx="292" cy="38" r="1.4"/>
    <circle cx="401" cy="88" r="1.0"/><circle cx="529" cy="34" r="1.5"/><circle cx="676" cy="74" r="1.1"/>
    <circle cx="812" cy="42" r="1.3"/><circle cx="948" cy="96" r="1.0"/><circle cx="1074" cy="52" r="1.5"/>
    <circle cx="1148" cy="150" r="1.2"/><circle cx="96" cy="332" r="1.2"/><circle cx="240" cy="376" r="1.0"/>
    <circle cx="640" cy="388" r="1.3"/><circle cx="1010" cy="356" r="1.2"/><circle cx="1120" cy="300" r="1.0"/>
  </g>
  <g fill="#e2b45f">
    <circle cx="140" cy="82" r="1.8"/><circle cx="744" cy="120" r="1.5"/><circle cx="880" cy="330" r="1.6"/>
    <text x="340" y="66" font-size="16" fill="#e2b45f">✦</text>
    <text x="1052" y="118" font-size="13" fill="#e2b45f">✦</text>
    <text x="744" y="302" font-size="13" fill="#e2b45f">✦</text>
  </g>

  <!-- Orbit-Duett rechts -->
  <g transform="translate(985, 205)">
    <ellipse rx="120" ry="74" fill="none" stroke="#7d739f" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="4 7"/>
    <circle r="3" fill="#e2b45f"/>
    <circle cx="-86" cy="-51" r="34" fill="url(#glowA)" opacity="0.9"/>
    <circle cx="-86" cy="-51" r="13" fill="#5fc6da"/>
    <text x="-86" y="-45" font-size="15" fill="#08222a" text-anchor="middle">♈&#xFE0E;</text>
    <circle cx="86" cy="51" r="31" fill="url(#glowB)" opacity="0.9"/>
    <circle cx="86" cy="51" r="11.5" fill="#ef7d9c"/>
    <text x="86" y="56" font-size="13" fill="#2c0d18" text-anchor="middle">♓&#xFE0E;</text>
    <text x="0" y="118" font-size="12" fill="#7d739f" text-anchor="middle" font-family="Menlo, monospace">… oder jede andere der 144 Kombinationen</text>
  </g>

  <!-- Wortmarke -->
  <text x="70" y="128" font-size="26" fill="#e2b45f" letter-spacing="6">✶ ✦ ✶</text>
  <text x="66" y="205" font-size="76" font-style="italic" font-weight="bold" fill="#efeafd">Sternenflunk</text>
  <text x="70" y="248" font-size="23" font-style="italic" fill="#b3a9d6">Wir flunkern. Die Sterne nicken dazu.</text>

  <!-- Feature-Pills: Text zentriert + textLength gedeckelt, läuft nie über den Rahmen -->
  <g font-family="Menlo, 'Cascadia Mono', monospace" font-size="13.5" lengthAdjust="spacingAndGlyphs" text-anchor="middle">
    <rect x="68" y="280" rx="16" width="300" height="32" fill="none" stroke="#5fc6da" stroke-opacity="0.6"/>
    <text x="218" y="301" fill="#5fc6da" textLength="256">✓ Alle 144 Zeichen-Kombinationen</text>
    <rect x="382" y="280" rx="16" width="324" height="32" fill="none" stroke="#ef7d9c" stroke-opacity="0.6"/>
    <text x="544" y="301" fill="#ef7d9c" textLength="280">✓ 87,3 % gefühlte Treffsicherheit*</text>
    <rect x="68" y="320" rx="16" width="300" height="32" fill="none" stroke="#e2b45f" stroke-opacity="0.6"/>
    <text x="218" y="341" fill="#e2b45f" textLength="256">✓ 0 Datenbanken, 0 echte Sterne</text>
    <rect x="382" y="320" rx="16" width="300" height="32" fill="none" stroke="#8FB861" stroke-opacity="0.6"/>
    <text x="532" y="341" fill="#8FB861" textLength="256">✓ Für Paare jeder Konstellation</text>
  </g>

  <text x="70" y="388" font-size="12.5" fill="#7d739f" font-family="Menlo, monospace">*Wert täglich frisch erflunkert. Genau wie alles andere hier — außer den Mondphasen, die sind echt.</text>

  <!-- Tierkreis-Zeile unten rechts -->
  <text x="1132" y="392" font-size="17" fill="#7d739f" text-anchor="end" letter-spacing="7">♈&#xFE0E;♉&#xFE0E;♊&#xFE0E;♋&#xFE0E;♌&#xFE0E;♍&#xFE0E;♎&#xFE0E;♏&#xFE0E;♐&#xFE0E;♑&#xFE0E;♒&#xFE0E;♓&#xFE0E;</text>
</svg>
